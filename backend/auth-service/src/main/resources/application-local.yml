spring:
  config:
    import: classpath:local-common.yml

server:
  port: 8082

jwt:
  expiration: 900000
  expirationRefresh: 2678400000
  secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789abcdef}

# Local-only credential for the admin endpoints.
# The in-app purchase settings (APPLE_*, GOOGLE_*, IAP_*) are deliberately not set: the purchase
# endpoints then answer "not configured" instead of calling Apple or Google. See README.md.
ADMIN_SECRET_KEY: local-admin-key
