# Validation
error.validation.not_blank=Must not be blank
error.validation.size=Must not exceed {max} characters
error.validation.email=Must be a valid email address

# Welcome Mail
mail.welcome.subject=Welcome to Debt Tracker!
mail.welcome.body=Hello,\n\nWelcome to Debt Tracker! Your account has been successfully created.\n\nYou can start tracking your debts right away.\n\nBest regards,\nDebt Tracker Team

# Password Reset Mail
mail.password_reset.subject=Password Reset
mail.password_reset.body=Hello,\n\nClick the link below to reset your password:\n\n{0}?token={1}\n\nThis link is valid for 15 minutes.\n\nIf you did not request this, please ignore this email.\n\nBest regards,\nDebt Tracker Team

# Debt Added Mail
mail.debt_added.subject=New debt added: {0}
mail.debt_added.body=Hello,\n\nA new debt "{0}" of {1} has been added to a shared category.\n\nBest regards,\nDebt Tracker Team

# Push Notifications
push.reminder.title=Payment Reminder: {0}
push.reminder.body=Reminder for "{0}": {1} is due soon.
push.debt_added.title=New Debt Added
push.debt_added.body=A new debt "{0}" of {1} has been added to your group.

# Reminder Mail
mail.reminder.subject=Payment Reminder: {0}
mail.reminder.body=Hello,\n\nThis is a reminder for your debt "{0}" of {1}. Your next payment is due on {2}.\n\nBest regards,\nDebt Tracker Team

# Category Member Added
