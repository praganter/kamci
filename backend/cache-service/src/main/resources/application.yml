spring:
  application:
    name: cache-service
  cloud:
    config:
      fail-fast: true
      uri: ${CONFIG_SERVER_URL:http://config-server:8888}
      name: cache-service,common-config

server:
  port: 8084

---
# Everything but `local` takes its settings from the config server and refuses to start without it.
spring:
  config:
    activate:
      on-profile: "!local"
    import: "configserver:"
