spring:
  application:
    name: cache-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: ${CONFIG_SERVER_URL:http://config-server:8888}
      name: cache-service,common-config
  data:
    redis:
      host: ${APP_REDIS_HOST:redis}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}

exchange-rate:
  base-currencies: ${EXCHANGE_BASE_CURRENCIES:USD,EUR,TRY,GBP}
  api-url: https://latest.currency-api.pages.dev/v1/currencies

server:
  port: 8084
