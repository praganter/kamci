spring:
  application:
    name: debt-service
  cloud:
    config:
      fail-fast: true
      uri: ${CONFIG_SERVER_URL:http://config-server:8888}
      name: debt-service,common-config
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          auth-service:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

---
# Everything but `local` takes its settings from the config server and refuses to start without it.
spring:
  config:
    activate:
      on-profile: "!local"
    import: "configserver:"
