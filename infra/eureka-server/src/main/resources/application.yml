spring:
  application:
    name: eureka-server
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}
      name: eureka-server,common-config
      fail-fast: true
      retry:
        initial-interval: 5000
        max-interval: 10000
        multiplier: 1.5
        max-attempts: 10