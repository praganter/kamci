server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    #active: git
    #local için
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:/config
        git:
          uri: http://192.0.2.10:3000/kamci/dt-config.git
          default-label: master

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://tempo:9411/api/v2/spans