server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: git
    #local için
    #active: native
  cloud:
    config:
      server:
        native:
          # Used when SPRING_PROFILES_ACTIVE=native (compose mounts ./config at /config).
          search-locations: ${CONFIG_NATIVE_LOCATIONS:file:/config}
        git:
          # Default backend (no profile flag): a Git repo holding the files of the config/ folder.
          uri: ${CONFIG_GIT_URI:}
          default-label: master

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://tempo:9411/api/v2/spans