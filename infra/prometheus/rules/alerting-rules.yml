groups:
  - name: kamci_basic_alerts
    rules:
      - alert: PodRestartingFrequently
        expr: changes(container_start_time_seconds{namespace="kamci", container!=""}[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }}/{{ $labels.container }} is restarting frequently"
          description: "Restarted {{ $value }} times in the last 15 minutes."

      # UNVERIFIED: kube-state-metrics is not installed, so OOM kills are detected with cAdvisor's
      # container_oom_events_total instead of kube_pod_container_status_last_terminated_reason.
      # Whether this kubelet/cAdvisor version exposes the metric was not checked on a live cluster
      # (look for it in /metrics/cadvisor). If it is missing the alert never fires (the expression
      # returns no series and raises no error).
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{namespace="kamci"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.pod }}/{{ $labels.container }} was OOM-killed"
          description: "The cAdvisor metric container_oom_events_total increased."

      # Scope: only PVC-backed volumes (tempo-pvc, loki-pvc). There is no node-exporter,
      # so the node root disk is not covered.
      - alert: PVCDiskAlmostFull
        expr: (kubelet_volume_stats_used_bytes{namespace="kamci"} / kubelet_volume_stats_capacity_bytes{namespace="kamci"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.persistentvolumeclaim }} is more than 85% full"
          description: "Usage is {{ $value | humanizePercentage }}."

      - alert: HighHttp5xxRate
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_count{status=~"5..", job=~"auth-service|debt-service|notification-service|gateway-server"}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job=~"auth-service|debt-service|notification-service|gateway-server"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 5xx rate is above 5%"
          description: "5xx rate over the last 5 minutes: {{ $value | humanizePercentage }}."
