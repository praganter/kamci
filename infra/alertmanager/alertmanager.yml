# Minimal iskelet: bildirim kanali (Slack/email/webhook) henuz tanimli degil.
# Kullaniciya sorulup receiver eklenene kadar alertler sadece Alertmanager
# UI'da / API'de gorunur, disariya push edilmez.
route:
  receiver: 'null'
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'null'
