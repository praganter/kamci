name: compose-smoke
on:
  push:
    branches: [main]
    paths: ['backend/**', 'infra/**', 'config/**', 'docker-compose.yml', 'scripts/**', '.github/workflows/compose-smoke.yml']
  pull_request:
    paths: ['backend/**', 'infra/**', 'config/**', 'docker-compose.yml', 'scripts/**', '.github/workflows/compose-smoke.yml']
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      # Run once per job: register is rate limited (5/hour).
      - run: bash scripts/smoke.sh
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
