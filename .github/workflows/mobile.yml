name: mobile
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          # pinned: build_runner crashes with Flutter 3.47.7
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code (freezed / riverpod / json / l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - run: flutter analyze
      # Integration tests need a running backend and are skipped here.
      # unit + widget tests with coverage; fails below 60% (generated code excluded)
      - run: bash tool/coverage.sh 60
