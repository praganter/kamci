appId: com.batuhanyetgin.kamci
---
# NOTIF-02: Logout'ta FCM token silinir, yeniden login'de kaydedilir
# Settings > "Çıkış Yap" → DELETE /notification/device-token çağrılır
# Re-login → POST /notification/device-token çağrılır
- runFlow: "../../subflows/_login_as_user_a.yaml"
- assertVisible:
    text: "Borçlar"
# Logout yap
- runFlow: "../../subflows/_logout.yaml"
- assertVisible:
    text: "Giriş Yap"
# Tekrar giriş yap — FCM token yeniden kaydedilmeli (POST /notification/device-token)
- tapOn:
    text: "E-posta Adresi"
- inputText: "${USER_A_EMAIL}"
- tapOn:
    text: "Şifre"
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Giriş Yap"
- assertVisible:
    text: "Borçlar"
