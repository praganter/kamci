appId: com.batuhanyetgin.kamci
---
# AUTH-06: Şifremi unuttum — link gönderildi mesajı
# Keychain sorunu yaşamamak için fresh login screen açılır
- runFlow: "../../subflows/_ensure_login_screen.yaml"
- tapOn:
    text: "Şifremi Unuttum?"
- assertVisible:
    text: "Şifremi Unuttum"
- tapOn:
    text: "E-posta Adresi"
- inputText: "${USER_A_EMAIL}"
- tapOn:
    text: "Şifre sıfırlama bağlantısı e-posta adresinize gönderilecek."
- tapOn:
    text: "Gönder"
- extendedWaitUntil:
    visible:
      text: "E-postanızı Kontrol Edin"
    timeout: 10000
