appId: com.batuhanyetgin.kamci
---
# AUTH-06: Şifremi unuttum — link gönderildi mesajı
- runFlow: "../../subflows/_ensure_login_screen.yaml"
- tapOn:
    text: "Şifremi Unuttum?"
- assertVisible:
    text: "Şifremi Unuttum"
- tapOn:
    text: "E-posta Adresi"
- inputText: "${USER_A_EMAIL}"
- tapOn:
    text: "Gönder"
- assertVisible:
    text: "E-postanızı Kontrol Edin"
