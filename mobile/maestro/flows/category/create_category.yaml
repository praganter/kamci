appId: com.batuhanyetgin.kamci
---
# CAT-01: Kategori oluştur
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Kategoriler"
- waitForAnimationToEnd
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Kategori"
- tapOn:
    text: "Kategori Adı"
- inputText: "Maestro Kategori"
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "Maestro Kategori"
