appId: com.batuhanyetgin.kamci
---
# HH-02: A → B davet, B kabul eder, ortak hane görünür, B ayrılır (temizlik dahil)
# Tek cihazda kullanıcı değiştirerek çalışır. USER_B_EMAIL/PASSWORD gerekir.

# B'de önceki koşudan kalan hane varsa temizle
- runFlow: "../../subflows/_login_as_user_b.yaml"
- runFlow: "../../subflows/_open_household.yaml"
- back

# A davet gönderir
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_open_household.yaml"
- tapOn: "E-posta"
- inputText: "${USER_B_EMAIL}"
- hideKeyboard
- tapOn: "Davet Gönder"
- extendedWaitUntil:
    visible: "(?s).*için davetiniz onay bekliyor.*"
    timeout: 10000
- back

# B daveti görür ve kabul eder
- runFlow: "../../subflows/_login_as_user_b.yaml"
- tapOn: "Ayarlar"
- scrollUntilVisible:
    element:
      text: "(?s)Hane\n.*"
    direction: DOWN
- tapOn: "(?s)Hane\n.*"
- extendedWaitUntil:
    visible: "(?s).*sizi hanesine davet etti.*"
    timeout: 15000
- tapOn: "Kabul Et"
- extendedWaitUntil:
    visible: "(?s).*ile ortak hane.*"
    timeout: 10000

# Temizlik: B ayrılır
- tapOn: "Haneden Ayrıl"
- extendedWaitUntil:
    visible: "Haneden ayrıl?"
    timeout: 3000
- tapOn:
    text: "Haneden Ayrıl"
    below: "Ortak gelir birleştirme durdurulacak."
- extendedWaitUntil:
    visible: "Henüz bir haneniz yok"
    timeout: 10000
