appId: com.batuhanyetgin.kamci
---
# PREM-04: Hatırlatma premium engeli — freemium hesap
# ⚠️ ÖNKOŞUL: User B'nin borç sayısı < 5 OLMALI (freeDebtLimit).
# 5 borçta FAB borç formu yerine limit gate'i açar → bu test forma giremez.
# debt_limit_gate TAM TERSİNİ ister (5 borç). İkisi aynı seed'le koşulamaz:
# önce reminder_gate'i (<5 borç) koş, sonra 5. borcu ekleyip debt_limit_gate'i koş.
- runFlow: "../../subflows/_login_as_user_b.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    id: "addDebtFab"
- extendedWaitUntil:
    visible:
      text: "Yeni Borç"
    timeout: 8000
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "Hatırlatma Test"
- tapOn:
    text: "Tutar"
- inputText: "100"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- waitForAnimationToEnd
- tapOn:
    id: "pickerOkBtn"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "reminderToggle"
    direction: DOWN
# Hatırlatma toggle'a tıkla
- tapOn:
    id: "reminderToggle"
# Premium sheet açılmalı
- assertVisible:
    text: "Premium Gerekli"
# Hatırlatma alanları görünmemeli
- assertNotVisible:
    text: "Bildirim Kanalları"
- tapOn:
    text: "Belki Daha Sonra"
