appId: com.batuhanyetgin.kamci
---
# PREM-04: Hatırlatma premium engeli — freemium hesap
- runFlow: "../../subflows/_login_as_user_b.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    text: "Kategori"
- waitForAnimationToEnd
- tapOn:
    index: 0
- tapOn:
    text: "Borç Adı"
- inputText: "Hatırlatma Test"
- tapOn:
    text: "Tutar"
- inputText: "100"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    text: "Para Birimi"
- waitForAnimationToEnd
- tapOn:
    text: "TRY"
- tapOn:
    text: "Ödeme Periyodu"
- waitForAnimationToEnd
- tapOn:
    text: "Aylık"
- scrollUntilVisible:
    element:
      text: "İlk Ödeme Tarihi"
    direction: DOWN
- tapOn:
    text: "İlk Ödeme Tarihi"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Hatırlatma"
    direction: DOWN
# Hatırlatma toggle'a tıkla
- tapOn:
    text: "Hatırlatma"
# Premium sheet açılmalı
- assertVisible:
    text: "Premium Gerekli"
# Hatırlatma alanları görünmemeli
- assertNotVisible:
    text: "Bildirim Kanalları"
- tapOn:
    text: "Belki Daha Sonra"
