appId: com.batuhanyetgin.kamci
---
# PREM-04: Hatırlatma premium engeli — freemium hesap
- runFlow: "../../subflows/_login_as_user_b.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    id: "addDebtFab"
- extendedWaitUntil:
    visible:
      text: "Yeni Borç"
    timeout: 8000
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "Hatırlatma Test"
- tapOn:
    text: "Tutar"
- inputText: "100"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- waitForAnimationToEnd
- tapOn:
    id: "pickerOkBtn"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "reminderToggle"
    direction: DOWN
# Hatırlatma toggle'a tıkla
- tapOn:
    id: "reminderToggle"
# Premium sheet açılmalı
- assertVisible:
    text: "Premium Gerekli"
# Hatırlatma alanları görünmemeli
- assertNotVisible:
    text: "Bildirim Kanalları"
- tapOn:
    text: "Belki Daha Sonra"
