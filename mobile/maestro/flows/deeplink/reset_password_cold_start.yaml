appId: com.batuhanyetgin.kamci
tags: [deeplink, manual]
---
# DEEP-01: Reset password deep link — cold start
# NOT: Geçerli bir reset token önceden alınmalı:
#   curl -X POST http://localhost:8080/auth/forget-password \
#     -H "Content-Type: application/json" \
#     -d '{"email":"USER_A_EMAIL"}'
# Token email'den alınıp aşağıya yapıştırılır
- stopApp
- openLink: "kamci://reset-password?token=TEST_RESET_TOKEN_REPLACE_ME"
# Deep link işlemi async: uygulama önce /login'e gidip sonra /reset-password'a yönleniyor
# extendedWaitUntil — element görünene kadar 10s bekler
- extendedWaitUntil:
    visible:
      text: "Şifre Sıfırla"
    timeout: 10000
- assertVisible:
    text: "Yeni Şifre"
