appId: com.batuhanyetgin.kamci
---
# DEEP-01: Reset password deep link — cold start
# NOT: Geçerli bir reset token önceden alınmalı:
#   curl -X POST http://198.51.100.10:30080/auth/forget-password \
#     -H "Content-Type: application/json" \
#     -d '{"email":"USER_A_EMAIL"}'
# Token email'den alınıp aşağıya yapıştırılır
- stopApp
- openLink: "debttracker://reset-password?token=TEST_RESET_TOKEN_REPLACE_ME"
- waitForAnimationToEnd
- assertVisible:
    text: "Şifre Sıfırla"
- assertVisible:
    text: "Yeni Şifre"
