appId: com.batuhanyetgin.kamci
tags: [deeplink, manual]
---
# DEEP-03: Reset password akışı — form doldur ve tamamla
# NOT: Geçerli tek kullanımlık token gerektirir
- stopApp
- openLink: "kamci://reset-password?token=TEST_RESET_TOKEN_REPLACE_ME"
- waitForAnimationToEnd
- assertVisible:
    text: "Şifre Sıfırla"
- tapOn:
    text: "Yeni Şifre"
    index: 0
- inputText: "YeniResetSifre123!"
- tapOn:
    text: "Şifre Tekrar"
- inputText: "YeniResetSifre123!"
- tapOn:
    text: "Şifreyi Güncelle"
- assertVisible:
    text: "başarıyla güncellendi"
# Login ekranına yönlenmeli
- assertVisible:
    text: "Giriş Yap"
