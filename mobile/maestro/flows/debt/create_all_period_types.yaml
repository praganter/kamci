appId: com.batuhanyetgin.kamci
---
# DEBT-03a..f: Tüm payment period tipleri
# Her borç oluşturulduktan hemen sonra silinir — 5-borç limitini aşmamak için
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd

# ── DAILY ──────────────────────────────────────────────────
- tapOn:
    id: "addDebtFab"
- extendedWaitUntil:
    visible:
      text: "Yeni Borç"
    timeout: 8000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "categoryField"
      - waitForAnimationToEnd
      - tapOn:
          text: "Tamam"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "categoryField"
      - scrollUntilVisible:
          element:
            text: "Test Kategorisi"
          direction: DOWN
          timeout: 10000
      - tapOn:
          text: "Test Kategorisi"
      - waitForAnimationToEnd
- tapOn:
    text: "Borç Adı"
- inputText: "Günlük Borç"
- tapOn:
    text: "Tutar"
- inputText: "10"
- tapOn:
    text: "Yeni Borç"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "currencyField"
      - waitForAnimationToEnd
      - tapOn:
          text: "Tamam"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "currencyField"
      - scrollUntilVisible:
          element:
            text: "TRY ₺"
          direction: DOWN
          timeout: 10000
      - tapOn:
          text: "TRY ₺"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "periodField"
      - waitForAnimationToEnd
      - repeat:
          times: 1
          commands:
            - runFlow: "../../subflows/_picker_wheel_next.yaml"
      - assertVisible:
          text: "Günlük"
      - tapOn:
          text: "Tamam"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "periodField"
      - scrollUntilVisible:
          element:
            text: "Günlük"
          direction: DOWN
          timeout: 10000
      - tapOn:
          text: "Günlük"
      - waitForAnimationToEnd
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- extendedWaitUntil:
    visible:
      id: "myDebtsTab"
    timeout: 35000
- waitForAnimationToEnd
- tapOn:
    text: "Kategoriler"
- waitForAnimationToEnd
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Günlük Borç[\\s\\S]*"
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: "Günlük Borç[\\s\\S]*"
- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
- waitForAnimationToEnd

