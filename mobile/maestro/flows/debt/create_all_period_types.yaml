appId: com.batuhanyetgin.kamci
---
# DEBT-03a..f: Tüm payment period tipleri
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd

# ── DAILY ──────────────────────────────────────────────────
- tapOn:
    point: "89%, 80%"
- tapOn:
    text: "Kategori"
- waitForAnimationToEnd
- tapOn:
    index: 0
- tapOn:
    text: "Borç Adı"
- inputText: "Günlük Borç"
- tapOn:
    text: "Tutar"
- inputText: "10"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    text: "Para Birimi"
- waitForAnimationToEnd
- tapOn:
    text: "TRY"
- tapOn:
    text: "Ödeme Periyodu"
- waitForAnimationToEnd
- tapOn:
    text: "Günlük"
- scrollUntilVisible:
    element:
      text: "İlk Ödeme Tarihi"
    direction: DOWN
- tapOn:
    text: "İlk Ödeme Tarihi"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "Günlük Borç"

