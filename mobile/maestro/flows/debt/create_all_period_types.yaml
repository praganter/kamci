appId: com.batuhanyetgin.kamci
---
# DEBT-03a..f: Tüm payment period tipleri
# Her borç oluşturulduktan hemen sonra silinir — 5-borç limitini aşmamak için
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd

# ── DAILY ──────────────────────────────────────────────────
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "Günlük Borç"
- tapOn:
    text: "Tutar"
- inputText: "10"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "TRY"
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Günlük"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "Günlük Borç"
- swipe:
    direction: LEFT
    element:
      text: "Günlük Borç"
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
- waitForAnimationToEnd

