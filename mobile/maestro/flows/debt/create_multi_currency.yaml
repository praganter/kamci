appId: com.batuhanyetgin.kamci
---
# DEBT-13/14: Multi-currency — USD ve EUR — testten sonra siler (test izolasyonu)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd

# ── USD ────────────────────────────────────────────────────
- tapOn:
    id: "addDebtFab"
- extendedWaitUntil:
    visible:
      text: "Yeni Borç"
    timeout: 8000
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "USD Test Borcu"
- tapOn:
    text: "Tutar"
- inputText: "1200"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- repeat:
    times: 14
    commands:
      - runFlow: "../../subflows/_picker_wheel_next.yaml"
- assertVisible:
    text: "USD[\\s\\S]*"
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tek Seferlik"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- extendedWaitUntil:
    visible:
      id: "myDebtsTab"
    timeout: 35000
- waitForAnimationToEnd
- tapOn:
    text: "Kategoriler"
- waitForAnimationToEnd
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
# Debt tile label'ı birleşiktir ("Ad\n0 / 1\n1200.0 USD") → [\s\S]* regex şart
- scrollUntilVisible:
    element:
      text: "USD Test Borcu[\\s\\S]*"
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: "USD Test Borcu[\\s\\S]*USD"
# Cleanup USD borcu
- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
- waitForAnimationToEnd

# ── EUR ────────────────────────────────────────────────────
- tapOn:
    id: "addDebtFab"
- extendedWaitUntil:
    visible:
      text: "Yeni Borç"
    timeout: 8000
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "EUR Test Borcu"
- tapOn:
    text: "Tutar"
- inputText: "900"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- repeat:
    times: 7
    commands:
      - runFlow: "../../subflows/_picker_wheel_next.yaml"
- assertVisible:
    text: "EUR[\\s\\S]*"
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tek Seferlik"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- extendedWaitUntil:
    visible:
      id: "myDebtsTab"
    timeout: 35000
- waitForAnimationToEnd
- tapOn:
    text: "Kategoriler"
- waitForAnimationToEnd
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
# Debt tile label'ı birleşiktir → [\s\S]* regex şart
- scrollUntilVisible:
    element:
      text: "EUR Test Borcu[\\s\\S]*"
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: "EUR Test Borcu[\\s\\S]*EUR"
# Cleanup EUR borcu
- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
