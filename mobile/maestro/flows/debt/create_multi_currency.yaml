appId: com.batuhanyetgin.kamci
---
# DEBT-13/14: Multi-currency — USD ve EUR — testten sonra siler (test izolasyonu)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd

# ── USD ────────────────────────────────────────────────────
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "USD Test Borcu"
- tapOn:
    text: "Tutar"
- inputText: "1200"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "USD"
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tek Seferlik"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "USD Test Borcu"
- assertVisible:
    text: "USD"
# Cleanup USD borcu
- swipe:
    direction: LEFT
    element:
      text: "USD Test Borcu"
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
- waitForAnimationToEnd

# ── EUR ────────────────────────────────────────────────────
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "EUR Test Borcu"
- tapOn:
    text: "Tutar"
- inputText: "900"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "EUR"
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tek Seferlik"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "EUR Test Borcu"
- assertVisible:
    text: "EUR"
# Cleanup EUR borcu
- swipe:
    direction: LEFT
    element:
      text: "EUR Test Borcu"
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
