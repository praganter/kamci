appId: com.batuhanyetgin.kamci
tags: [debt]
---
# DEBT-07: Parçalı ödeme — testten sonra siler (test izolasyonu)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- runFlow: "../../subflows/_create_monthly_debt.yaml"
- tapOn:
    text: "Borçlar"
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- swipe:
    start: "25%, 40%"
    end: "95%, 40%"
- waitForAnimationToEnd
- assertVisible:
    text: "Ödeme İşlemleri"
- tapOn:
    text: "Parçalı Ödeme"
- assertVisible:
    text: "Tutar Girin"
- tapOn:
    text: "Tutar Girin"
- inputText: "75"
# OK butonu "Tamam" (MaterialLocalizations.okButtonLabel = Tamam)
- tapOn:
    text: "Tamam"
- assertVisible:
    text: "[\\s\\S]*kayıt edildi[\\s\\S]*"
# Cleanup: borcu sil
- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
