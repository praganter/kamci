appId: com.batuhanyetgin.kamci
---
# DEBT-01: ONE_TIME borç oluştur — testten sonra siler (test izolasyonu)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "Tek Seferlik Test Borcu"
- tapOn:
    text: "Tutar"
- inputText: "150"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "TRY"
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tek Seferlik"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
# Taksit alanı görünmemeli (ONE_TIME)
- assertNotVisible:
    text: "Taksit Sayısı"
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "Tek Seferlik Test Borcu"
- assertVisible:
    text: "150"
# Cleanup: borcu sil (limit aşımını önle)
- swipe:
    direction: LEFT
    element:
      text: "Tek Seferlik Test Borcu"
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
