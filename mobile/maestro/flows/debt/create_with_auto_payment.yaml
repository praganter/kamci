appId: com.batuhanyetgin.kamci
---
# DEBT-15: Auto Payment flag — testten sonra siler (test izolasyonu)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "Otomatik Ödemeli Borç"
- tapOn:
    text: "Tutar"
- inputText: "250"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "TRY"
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Aylık"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Otomatik Ödeme"
    direction: DOWN
# Otomatik Ödeme toggle'ını aç
- tapOn:
    text: "Otomatik Ödeme"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "Otomatik Ödemeli Borç"
# Cleanup: borcu sil
- swipe:
    direction: LEFT
    element:
      text: "Otomatik Ödemeli Borç"
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
