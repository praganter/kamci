appId: com.batuhanyetgin.kamci
tags: [debt]
---
# DEBT-15: Auto Payment flag — testten sonra siler (test izolasyonu)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    id: "addDebtFab"
- extendedWaitUntil:
    visible:
      text: "Yeni Borç"
    timeout: 8000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "categoryField"
      - waitForAnimationToEnd
      - tapOn:
          text: "Tamam"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "categoryField"
      - scrollUntilVisible:
          element:
            text: "Test Kategorisi"
          direction: DOWN
          timeout: 10000
      - tapOn:
          text: "Test Kategorisi"
      - waitForAnimationToEnd
- tapOn:
    text: "Borç Adı"
- inputText: "Otomatik Ödemeli Borç"
- tapOn:
    text: "Tutar"
- inputText: "250"
- tapOn:
    text: "Yeni Borç"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "currencyField"
      - waitForAnimationToEnd
      - tapOn:
          text: "Tamam"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "currencyField"
      - scrollUntilVisible:
          element:
            text: "TRY ₺"
          direction: DOWN
          timeout: 10000
      - tapOn:
          text: "TRY ₺"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "periodField"
      - waitForAnimationToEnd
      - repeat:
          times: 4
          commands:
            - runFlow: "../../subflows/_picker_wheel_next.yaml"
      - assertVisible:
          text: "Aylık"
      - tapOn:
          text: "Tamam"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "periodField"
      - scrollUntilVisible:
          element:
            text: "Aylık"
          direction: DOWN
          timeout: 10000
      - tapOn:
          text: "Aylık"
      - waitForAnimationToEnd
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Otomatik Ödeme"
    direction: DOWN
# Otomatik Ödeme toggle'ını aç
- tapOn:
    text: "Otomatik Ödeme"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- extendedWaitUntil:
    visible:
      id: "myDebtsTab"
    timeout: 35000
- waitForAnimationToEnd
- tapOn:
    text: "Kategoriler"
- waitForAnimationToEnd
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
# Debt tile label'ı birleşiktir → [\s\S]* regex şart
- scrollUntilVisible:
    element:
      text: "Otomatik Ödemeli Borç[\\s\\S]*"
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: "Otomatik Ödemeli Borç[\\s\\S]*"
# Cleanup: borcu sil
- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
