appId: com.batuhanyetgin.kamci
---
# DEBT-15: Auto Payment flag
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    text: "Kategori"
- waitForAnimationToEnd
- tapOn:
    index: 0
- tapOn:
    text: "Borç Adı"
- inputText: "Otomatik Ödemeli Borç"
- tapOn:
    text: "Tutar"
- inputText: "250"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    text: "Para Birimi"
- waitForAnimationToEnd
- tapOn:
    text: "TRY"
- tapOn:
    text: "Ödeme Periyodu"
- waitForAnimationToEnd
- tapOn:
    text: "Aylık"
- scrollUntilVisible:
    element:
      text: "İlk Ödeme Tarihi"
    direction: DOWN
- tapOn:
    text: "İlk Ödeme Tarihi"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Otomatik Ödeme"
    direction: DOWN
# Otomatik Ödeme toggle'ını aç
- tapOn:
    text: "Otomatik Ödeme"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "Otomatik Ödemeli Borç"
