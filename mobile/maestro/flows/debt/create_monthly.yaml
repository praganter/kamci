appId: com.batuhanyetgin.kamci
---
# DEBT-02: MONTHLY 12 taksitli borç — testten sonra siler (test izolasyonu)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "Aylık Taksit Borcu"
- tapOn:
    text: "Tutar"
- inputText: "600"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "TRY"
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Aylık"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
# Taksit alanı görünmeli (MONTHLY için)
- assertVisible:
    text: "Toplam Taksit Sayısı"
- tapOn:
    text: "Toplam Taksit Sayısı"
- inputText: "12"
- tapOn:
    text: "Yeni Borç"
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- assertVisible:
    text: "Aylık Taksit Borcu"
# Taksit göstergesi: "0 / 12"
- assertVisible:
    text: "0 / 12"
# Cleanup: borcu sil
- swipe:
    direction: LEFT
    element:
      text: "Aylık Taksit Borcu"
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
