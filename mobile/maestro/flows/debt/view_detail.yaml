- tapOn:
    text: "Test Borcu[\\s\\S]*"
- waitForAnimationToEnd
# Detaydaki info kartı TEK birleşik accessibility node'dur:
# "Tutar\n₺500\nDurum\nAktif\nÖdeme Periyodu\nTek Seferlik\nBaşlangıç\n..."
# → tüm alanlar tek regex ile doğrulanır ([\s\S]* newline'ları aşar)
- assertVisible:
    text: "Tutar[\\s\\S]*₺500[\\s\\S]*Tek Seferlik[\\s\\S]*Başlangıç[\\s\\S]*"
# Başlık "Ödeme Geçmişi (N)" formatındadır
- assertVisible:
    text: "Ödeme Geçmişi.*"
