appId: com.batuhanyetgin.kamci
---
# DEBT-05: Borç düzenleme — testten sonra siler (test izolasyonu)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_cleanup_all_debts.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- runFlow: "../../subflows/_create_default_debt.yaml"
- tapOn:
    text: "Test Borcu"
- waitForAnimationToEnd
# Düzenle butonuna tıkla
- tapOn:
    text: "Düzenle"
- assertVisible:
    text: "Borcu Düzenle"
# Borç adını güncelle
- tapOn:
    text: "Borç Adı"
- eraseText: 100
- inputText: "Güncellenmiş Borç"
# Tutarı güncelle
- tapOn:
    text: "Tutar"
- eraseText: 100
- inputText: "999"
- tapOn:
    text: "Borcu Düzenle"
- tapOn:
    text: "Güncelle"
- assertVisible:
    text: "Güncellenmiş Borç"
- assertVisible:
    text: "999"
# Geri dön (Detail → List) sonra borcu sil
- tapOn:
    text: "Geri"
- waitForAnimationToEnd
- swipe:
    direction: LEFT
    element:
      text: "Güncellenmiş Borç"
- assertVisible:
    text: "Borcu Sil"
- tapOn:
    text: "Sil"
