appId: com.batuhanyetgin.kamci
---
# EDGE-06/07: Özel karakter ve uzun string — UI kırılmamalı
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
# Emoji ve özel karakter içeren isim
- inputText: "Test 🎉 Borcu #$%&*@!"
- tapOn:
    text: "Tutar"
- inputText: "1"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tek Seferlik"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- waitForAnimationToEnd
- tapOn:
    id: "pickerOkBtn"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
# UI kırılmamalı — hata yoksa borç oluşturulur, varsa hata SnackBar gelir
- waitForAnimationToEnd
- assertNotVisible:
    text: "Beklenmeyen"
