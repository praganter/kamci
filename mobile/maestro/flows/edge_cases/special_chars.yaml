appId: com.batuhanyetgin.kamci
---
# EDGE-06/07: Özel karakter ve uzun string — UI kırılmamalı
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow: "../../subflows/_create_default_category.yaml"
- tapOn:
    text: "Borçlar"
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    text: "Kategori"
- waitForAnimationToEnd
- tapOn:
    index: 0
- tapOn:
    text: "Borç Adı"
# Emoji ve özel karakter içeren isim
- inputText: "Test 🎉 Borcu #$%&*@!"
- tapOn:
    text: "Tutar"
- inputText: "1"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    text: "Para Birimi"
- waitForAnimationToEnd
- tapOn:
    text: "TRY"
- tapOn:
    text: "Ödeme Periyodu"
- waitForAnimationToEnd
- tapOn:
    text: "Tek Seferlik"
- scrollUntilVisible:
    element:
      text: "İlk Ödeme Tarihi"
    direction: DOWN
- tapOn:
    text: "İlk Ödeme Tarihi"
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
# UI kırılmamalı — hata yoksa borç oluşturulur, varsa hata SnackBar gelir
- waitForAnimationToEnd
- assertNotVisible:
    text: "Beklenmeyen"
