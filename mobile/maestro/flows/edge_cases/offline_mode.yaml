appId: com.batuhanyetgin.kamci
tags: [edge_cases]
# Flow nasıl biterse bitsin ağı geri aç — açık kalan uçak modu sonraki tüm
# flow'ları (login) kırar.
onFlowComplete:
  - runFlow:
      when:
        platform: Android
      commands:
        - setAirplaneMode: disabled
---
# EDGE-01: Offline mod — ağ kesilince lokalize hata + "Tekrar Dene" ile toparlanma
# Android: ağ login'den SONRA Maestro setAirplaneMode ile kesilir (önceden ağ
# flow başlamadan kapatılıyordu → login imkânsızdı).
# iOS: setAirplaneMode desteklenmez — scripts/toggle_network.sh ile
#   login sonrası ağı dışarıdan kesin (run_p2_edge_cases.sh).
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - waitForAnimationToEnd:
          timeout: 3000
# Pull-to-refresh — ağ kapalıyken lokalize bağlantı hatası
- swipe:
    start: "50%, 35%"
    end: "50%, 75%"
    duration: 500
- extendedWaitUntil:
    visible: "(?s).*İnternet bağlantısı yok.*"
    timeout: 30000
- assertVisible: "Tekrar Dene"
- assertNotVisible: "(?s).*(Exception|DioException).*"
# Ağ geri gelince "Tekrar Dene" listeyi yükler
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn: "Tekrar Dene"
- extendedWaitUntil:
    notVisible: "(?s).*İnternet bağlantısı yok.*"
    timeout: 30000
- assertVisible:
    id: "myDebtsTab"
