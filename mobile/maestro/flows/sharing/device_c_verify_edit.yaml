appId: com.batuhanyetgin.kamci
tags: [sharing, multi-device]
---
# SHARE-03 (Device C): EDIT yetkisi doğrulama
# EDIT = canWrite ✓, canEdit ✓, canDelete ✗
#
# 🚫 BLOKE — backend bug: /category/getAll üyelerde userId döndürmüyor.
# categoryAccessLevels (category_providers.dart) üyeyi m.userId == currentUserId
# ile arar; userId hep null olduğundan eşleşme tutmaz ve orElse → AccessLevel.read
# çalışır. Sonuç: sahibin verdiği EDIT alıcıda sessizce OKUMA'ya düşer.
# Backend members[].userId döndürene kadar bu test GEÇEMEZ. [[project-api-blocker]]
#
# ÖNKOŞUL: reset_sharing_state.py + device_a_share_edit.yaml hemen önce koşmalı.
- runFlow: "../../subflows/_login_as_user_c.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    id: "sharedDebtsTab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Test Borcu[\\s\\S]*"
    timeout: 10000
# 1) Detayda Düzenle → canEdit VAR → düzenleme formu açılmalı
- tapOn:
    text: "Test Borcu[\\s\\S]*"
- waitForAnimationToEnd
- tapOn:
    text: "Düzenle"
- extendedWaitUntil:
    visible:
      text: "Borcu Düzenle"
    timeout: 8000
- tapOn:
    text: "İptal"
- waitForAnimationToEnd
- tapOn:
    text: "Geri"
- waitForAnimationToEnd
# 2) Sola swipe = silme → canDelete YOK → "yetkiniz yok"
# element-swipe yerine koordinat swipe (TabBarView çakışması).
- swipe:
    from:
      text: "[\\s\\S]*\\d+\\.\\d+ [A-Z]{3}"
      index: 0
    direction: LEFT
    duration: 400
- extendedWaitUntil:
    visible:
      text: "[\\s\\S]*yetkiniz yok[\\s\\S]*"
    timeout: 8000
# 3) Sağa swipe = ödeme → canWrite VAR
- swipe:
    from:
      text: "[\\s\\S]*\\d+\\.\\d+ [A-Z]{3}"
      index: 0
    direction: RIGHT
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Ödeme İşlemleri"
    timeout: 8000
