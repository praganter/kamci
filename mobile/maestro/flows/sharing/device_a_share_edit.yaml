appId: com.batuhanyetgin.kamci
---
# SHARE-03 (Device A): User C'yi EDIT yetkisiyle paylaşıma al
# Önceki hâli "Erişim Seviyesini Değiştir" ekranını kullanıyordu — öyle bir ekran
# uygulamada YOK (changeAccessLevel ölü l10n string'i). Bkz _share_with_c_as.yaml.
# ⚠️ ÖNKOŞUL: python3 scripts/reset_sharing_state.py
- runFlow: "../../subflows/_login_as_user_a.yaml"
- runFlow:
    file: "../../subflows/_share_with_c_as.yaml"
    env:
      LEVEL: "Düzenleme"
# Üye satırındaki AccessLevelBadge EDIT'i göstermeli
- assertVisible:
    text: "[\\s\\S]*Düzenleme[\\s\\S]*"
