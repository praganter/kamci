appId: com.batuhanyetgin.kamci
---
# SHARE-03 (Device A): User B'yi EDIT yetkisine yükselt
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Kategoriler"
- tapOn:
    text: "Sahip Olduklarım"
    index: 0
- tapOn:
    text: "Test Kategorisi"
- waitForAnimationToEnd
- tapOn:
    text: "${USER_B_EMAIL}"
- assertVisible:
    text: "Erişim Seviyesini Değiştir"
- tapOn:
    text: "Düzenleme"
- tapOn:
    text: "Kaydet"
- assertVisible:
    text: "Düzenleme"
