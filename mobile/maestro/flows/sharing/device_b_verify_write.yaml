appId: com.batuhanyetgin.kamci
---
# SHARE-02 (Device B): WRITE yetkisi doğrulama
- runFlow: "../../subflows/_login_as_user_b.yaml"
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    id: "sharedDebtsTab"
- waitForAnimationToEnd
# FAB görünmeli — WRITE yetkisi var
- assertVisible:
    point: "89%, 80%"
# Yeni borç formu açılabilmeli
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- tapOn:
    text: "İptal"
# Edit (düzenle) butonu görünmemeli — canEdit=false (WRITE)
- tapOn:
    text: "Test Borcu"
- assertNotVisible:
    text: "Düzenle"
- tapOn:
    text: "Geri"
