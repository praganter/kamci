appId: com.batuhanyetgin.kamci
tags: [settings]
---
# SET-04: Şifre format doğrulaması
# NOT: UI'da artık "Şifre Tekrar" alanı yok (kaldırıldı).
# Mismatch testi yerine: çok kısa şifre format hatası test edilir.
# Validators.password → minimum 8 karakter
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Ayarlar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "(?s)Şifre Değiştir.*"
- tapOn:
    text: "Mevcut Şifre"
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Yeni Şifre"
- inputText: "kisa"
- tapOn:
    text: "Şifreyi Güncelle"
- waitForAnimationToEnd
# Android: açık Gboard'un araç çubuğunda "Ayarlar" butonu var → aşağıdaki
# assertNotVisible klavyeyle eşleşiyordu.
- hideKeyboard
# Validation hata mesajı görünmeli (şifre ekranında kalmalı)
- assertVisible:
    text: "Mevcut Şifre"
- assertNotVisible:
    text: "Ayarlar"
