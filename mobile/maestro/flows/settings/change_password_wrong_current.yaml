appId: com.batuhanyetgin.kamci
tags: [settings]
---
# SET-03: Yanlış mevcut şifre — hata mesajı
# Hata container'da kalıcı olarak gösterilir (snackbar değil)
# Provider UnauthorizedException → 'Mevcut şifre hatalı.' (TR hardcoded)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Ayarlar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "(?s)Şifre Değiştir.*"
- tapOn:
    text: "Mevcut Şifre"
- inputText: "YanlisEskiSifre999!"
- tapOn:
    text: "Yeni Şifre"
- inputText: "YeniTestPass456!"
- tapOn:
    text: "Şifreyi Güncelle"
- waitForAnimationToEnd
# DOĞRU davranış (2026-07-15 canlı doğrulandı): yanlış mevcut şifre kullanıcıyı
# LOGOUT ETMEZ — change-password ekranında kalıp container'da kalıcı hata gösterir.
# (Provider UnauthorizedException'ı yakalayıp 'Mevcut şifre hatalı.' set eder;
# auth interceptor'ın genel 401→logout yolu burada tetiklenmez.)
- extendedWaitUntil:
    visible:
      text: "Mevcut şifre hatalı."
    timeout: 10000
