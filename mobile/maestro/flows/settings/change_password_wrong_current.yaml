appId: com.batuhanyetgin.kamci
---
# SET-03: Yanlış mevcut şifre — hata mesajı
# Hata container'da kalıcı olarak gösterilir (snackbar değil)
# Provider UnauthorizedException → 'Mevcut şifre hatalı.' (TR hardcoded)
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Ayarlar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "(?s)Şifre Değiştir.*"
- tapOn:
    text: "Mevcut Şifre"
- inputText: "YanlisEskiSifre999!"
- tapOn:
    text: "Yeni Şifre"
- inputText: "YeniTestPass456!"
- tapOn:
    text: "Şifreyi Güncelle"
- waitForAnimationToEnd
# Yanlış şifre → 401 → auth interceptor oturumu kapatır → login ekranı
# GoRouter stack replacement sonrası XCTest tree geçici invalid olur;
# launchApp ile fresh tree üzerinden doğrula
- launchApp:
    clearKeychain: false
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      text: "E-posta Adresi"
    timeout: 10000
