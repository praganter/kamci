appId: com.batuhanyetgin.kamci
---
# SET-02: Şifre değiştirme — başarılı akış
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Ayarlar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "Şifre Değiştir"
- assertVisible:
    text: "Mevcut Şifre"
- tapOn:
    text: "Mevcut Şifre"
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Yeni Şifre"
    index: 0
- inputText: "YeniTestPass456!"
- tapOn:
    text: "Şifre Tekrar"
- inputText: "YeniTestPass456!"
- tapOn:
    text: "Şifreyi Güncelle"
- assertVisible:
    text: "başarıyla güncellendi"
# Şifreyi eski haline geri al
- tapOn:
    text: "Mevcut Şifre"
- inputText: "YeniTestPass456!"
- tapOn:
    text: "Yeni Şifre"
    index: 0
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Şifre Tekrar"
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Şifreyi Güncelle"
- assertVisible:
    text: "başarıyla güncellendi"
