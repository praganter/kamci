appId: com.batuhanyetgin.kamci
---
# SET-02: Şifre değiştirme — başarılı akış
# UI: Mevcut Şifre + Yeni Şifre (Şifre Tekrar yok — tek field)
# "Şifre Değiştir" ListTile a11y = "title\nsubtitle" → (?s) regex
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    text: "Ayarlar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "(?s)Şifre Değiştir.*"
- assertVisible:
    text: "Mevcut Şifre"
- tapOn:
    text: "Mevcut Şifre"
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Yeni Şifre"
- inputText: "YeniTestPass456!"
- tapOn:
    text: "Şifreyi Güncelle"
- waitForAnimationToEnd
# Başarılıysa Ayarlar ekranına geri döner
- assertVisible:
    text: "Ayarlar"

# Şifreyi eski haline geri al
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "(?s)Şifre Değiştir.*"
- assertVisible:
    text: "Mevcut Şifre"
- tapOn:
    text: "Mevcut Şifre"
- inputText: "YeniTestPass456!"
- tapOn:
    text: "Yeni Şifre"
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Şifreyi Güncelle"
- waitForAnimationToEnd
- assertVisible:
    text: "Ayarlar"
