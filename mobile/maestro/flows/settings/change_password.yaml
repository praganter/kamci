appId: com.batuhanyetgin.kamci
tags: [settings]
# Flow nerede kırılırsa kırılsın USER_A şifresini geri al (API ile).
onFlowComplete:
  - runScript: "../../scripts/restore_user_a_password.js"
---
# SET-02: Şifre değiştirme — başarılı akış + geri alma
# UI: Mevcut Şifre + Yeni Şifre (Şifre Tekrar yok — tek field)
# "Şifre Değiştir" ListTile a11y = "title\nsubtitle" → (?s) regex
# NOT: Başarı eskiden `assertVisible: "Ayarlar"` ile kontrol ediliyordu;
# Android'de açık Gboard'un "Ayarlar" butonu bunu her durumda geçiriyor ve
# geri alma sessizce başarısız olup hesap geçici şifrede kalıyordu.
- runFlow: "../../subflows/_login_as_user_a.yaml"
- tapOn:
    id: "navSettings"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "(?s)Şifre Değiştir.*"
- assertVisible:
    text: "Mevcut Şifre"
- tapOn:
    text: "Mevcut Şifre"
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Yeni Şifre"
- inputText: "YeniTestPass456!"
- hideKeyboard
- tapOn:
    text: "Şifreyi Güncelle"
- extendedWaitUntil:
    visible: "Şifreniz başarıyla güncellendi."
    timeout: 10000
- extendedWaitUntil:
    notVisible: "Şifreniz başarıyla güncellendi."
    timeout: 10000

# Şifreyi eski haline geri al
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "(?s)Şifre Değiştir.*"
- assertVisible:
    text: "Mevcut Şifre"
- tapOn:
    text: "Mevcut Şifre"
- inputText: "YeniTestPass456!"
- tapOn:
    text: "Yeni Şifre"
- inputText: "${USER_A_PASSWORD}"
- hideKeyboard
- tapOn:
    text: "Şifreyi Güncelle"
- extendedWaitUntil:
    visible: "Şifreniz başarıyla güncellendi."
    timeout: 10000
# Geri alma gerçekten oldu mu: .env şifresiyle yeniden giriş
- runFlow: "../../subflows/_login_as_user_a.yaml"
