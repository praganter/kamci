appId: com.batuhanyetgin.kamci
---
# Görünen aydaki "Kendi Borçlarım" borçlarını siler. Liste boşalınca
# ("Henüz borç yok") hemen çıkar — sabit tekrar + optional "Sil" timeout'u
# boş ayda her denemede ~saniyeler harcıyordu.
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- repeat:
    while:
      notVisible: "Henüz borç yok"
    times: 6
    commands:
      - tapOn:
          id: "myDebtsTab"
      # Boş ayda swipe TabBarView'ü kaydırır — yukarıdaki while bunu önler.
      # Borç satırı: "Ad\n0 / 6\n₺500" (tek seferlikte ikinci satır "0").
      # Özet kartı ve kategori başlığı ikinci satırda tutar taşıdığı için eşleşmez.
      - swipe:
          from:
            text: "[^\\n]+\\n\\d+( / \\d+)?\\n[^\\n]+"
            index: 0
          direction: LEFT
      - waitForAnimationToEnd
      - tapOn:
          text: "Sil"
          optional: true
      - waitForAnimationToEnd
