appId: com.batuhanyetgin.kamci
---
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- tapOn:
    point: "89%, 80%"
- assertVisible:
    text: "Yeni Borç"
- waitForAnimationToEnd
# Kategori picker
- tapOn:
    id: "categoryField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
# Borç adı ve tutar
- tapOn:
    text: "Borç Adı"
- inputText: "Test Borcu"
- tapOn:
    text: "Tutar"
- inputText: "500"
- tapOn:
    text: "Yeni Borç"
# Para Birimi picker
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
# Ödeme Periyodu picker
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
# İlk Ödeme Tarihi picker
- tapOn:
    id: "dateField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
- waitForAnimationToEnd
- assertVisible:
    text: "Test Borcu"
