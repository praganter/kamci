appId: com.batuhanyetgin.kamci
---
# Pay testleri için AYLIK "Test Borcu" oluşturur (500 TRY, taksit boş).
# NEDEN AYLIK: Backend /debt/pay ve /debt/skip, ONE_TIME borçlarda HTTP 500
# dönüyor (error.unexpected — 2026-07-15'te doğrulandı); MONTHLY'de sorunsuz.
- waitForAnimationToEnd
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- tapOn:
    id: "addDebtFab"
- waitForAnimationToEnd
- tapOn:
    id: "categoryField"
- extendedWaitUntil:
    visible:
      text: "Tamam"
    timeout: 5000
- tapOn:
    text: "Tamam"
- tapOn:
    text: "Borç Adı"
- inputText: "Test Borcu"
- tapOn:
    text: "Tutar"
- inputText: "500"
- tapOn:
    text: "Yeni Borç"
- tapOn:
    id: "currencyField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- tapOn:
    id: "periodField"
- waitForAnimationToEnd
- repeat:
    times: 4
    commands:
      - runFlow: "_picker_wheel_next.yaml"
- assertVisible:
    text: "Aylık"
- tapOn:
    text: "Tamam"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "dateField"
    direction: DOWN
- tapOn:
    id: "dateField"
- waitForAnimationToEnd
- tapOn:
    text: "Tamam"
- scrollUntilVisible:
    element:
      text: "Oluştur"
    direction: DOWN
- tapOn:
    text: "Oluştur"
# Form kapanış animasyon race'i: Kategoriler→Borçlar bounce ile temiz state
- extendedWaitUntil:
    visible:
      id: "myDebtsTab"
    timeout: 35000
- waitForAnimationToEnd
- tapOn:
    text: "Kategoriler"
- waitForAnimationToEnd
- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Test Borcu[\\s\\S]*"
    direction: DOWN
    timeout: 20000
