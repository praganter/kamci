appId: com.batuhanyetgin.kamci
---
# iOS'ta clearState Keychain'i silmiyor — önce logout dene (optional), sonra login yap
# scrollUntilVisible timeout:2000 — varsayılan 20s yerine; optional olduğu için kısa tutulur
- launchApp
- waitForAnimationToEnd
# Bildirim izin popup'ını kapat (ilk kurulumda çıkar)
- tapOn:
    text: "İzin Ver"
    optional: true
# Uygulama içindeyse logout yap
- tapOn:
    text: "Ayarlar"
    optional: true
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
    timeout: 2000
    optional: true
- tapOn:
    text: "Çıkış Yap"
    optional: true
- tapOn:
    text: "Çıkış Yap"
    optional: true
    index: 1
- waitForAnimationToEnd
- tapOn:
    text: "E-posta Adresi"
- inputText: "${USER_A_EMAIL}"
- tapOn:
    text: "Şifre"
- inputText: "${USER_A_PASSWORD}"
- tapOn:
    text: "Giriş Yap"
- assertVisible:
    text: "Borçlar"
