- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- tapOn:
    text: "Sil"
    optional: true
- waitForAnimationToEnd

# ── 1 ay geri (Haziran 2026) ─────────────────────────────────────────────────
- tapOn:
    id: "prevMonthBtn"
- waitForAnimationToEnd
# Month navigation causes a brief accessibility gap — wait for the tab to reappear
- extendedWaitUntil:
    visible:
      id: "myDebtsTab"
    timeout: 5000
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- tapOn:
    text: "Sil"
    optional: true
- waitForAnimationToEnd
- tapOn:
