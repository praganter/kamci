appId: com.batuhanyetgin.kamci
---
# Cleanup: tüm test borçlarını siler.
# Mevcut ay + 2 ay öncesini kontrol eder.
# Boş ayda swipe, TabBarView'ün gesture handler'ını tetikler → tab kayar.
# Her ay bölümünden önce myDebtsTab'a kilitle.

- tapOn:
    text: "Borçlar"
- waitForAnimationToEnd
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd

# ── Mevcut ay (Temmuz 2026) ──────────────────────────────────────────────────
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- tapOn:
    text: "Sil"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "myDebtsTab"
- swipe:
    start: "75%, 40%"
    end: "5%, 40%"
- waitForAnimationToEnd
- tapOn:
    text: "Sil"
    optional: true
- waitForAnimationToEnd
- tapOn:
