# ── Mevcut aya geri dön (Mayıs → Temmuz: 2x ileri) ──────────────────────────
# nextMonthBtn iOS accessibility tree'de görünmüyor (Flutter bug: Row semantics collapse)
# → Koordinat tabanlı tap kullanılır. Body y=115pt'de başlar; month nav center y≈151pt=18%
# X: 393-16-24=353pt=90%; Y: 115+12+24=151pt=18%
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- tapOn:
    point: "90%, 18%"
- waitForAnimationToEnd
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
- tapOn:
    point: "90%, 18%"
- waitForAnimationToEnd
- tapOn:
    id: "myDebtsTab"
- waitForAnimationToEnd
