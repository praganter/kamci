appId: com.batuhanyetgin.kamci
---
# Settings > "Çıkış Yap" butonuna basar, confirm dialog'da onaylar
- tapOn:
    text: "Ayarlar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Çıkış Yap"
    direction: DOWN
- tapOn:
    text: "Çıkış Yap"
- waitForAnimationToEnd
# Confirm dialog
- assertVisible:
    text: "Hesabınızdan çıkış yapmak istediğinize emin misiniz?"
- tapOn:
    text: "Çıkış Yap"
    index: 1
- waitForAnimationToEnd
- assertVisible:
    text: "Giriş Yap"
