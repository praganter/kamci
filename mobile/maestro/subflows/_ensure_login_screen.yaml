appId: com.batuhanyetgin.kamci
---
# clearKeychain: true → stale token yok, auth check <1s'de tamamlanır.
# permissions:all:allow → izin diyaloğu otomatik kabul edilir.
# Deep link dialog'u kapat (deeplink testinden kalabilir).
- launchApp:
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    text: "Vazgeç"
    optional: true
- tapOn:
    text: "Vazgeç"
    optional: true
- extendedWaitUntil:
    visible:
      text: "E-posta Adresi"
    timeout: 10000
