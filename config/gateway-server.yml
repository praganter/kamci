server:
  port: 8080

spring:
  cloud:
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: initialCapacity=10,maximumSize=500,expireAfterWrite=5m
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: debt-service
          uri: lb://DEBT-SERVICE
          predicates:
            - Path=/debt/**,/category/**
          filters:
            - name: CircuitBreaker
              args:
                name: debt-service
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notification/**
          filters:
            - name: CircuitBreaker
              args:
                name: notification-service

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka}

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: debt-service
        url: /debt-service/v3/api-docs
      - name: notification-service
        url: /notification-service/v3/api-docs

endpoints:
  publicEndpoints:
    - /auth/register
    - /auth/login
    - /auth/refresh-token
    - /auth/forget-password
    - /auth/reset-password
    - /eureka/**
    - /actuator/health
    - /actuator/prometheus
    - /actuator/info
    - /swagger-ui.html
    - /swagger-ui/**
    - /webjars/**
    - /*/v3/api-docs

rate-limit:
  rules:
    - path: /auth/login
      capacity: 10
      refillTokens: 10
      refillSeconds: 60
    - path: /auth/forget-password
      capacity: 5
      refillTokens: 5
      refillSeconds: 3600

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
