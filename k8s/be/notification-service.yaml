apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: kamci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      priorityClassName: kamci-high-priority
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: notification-service
          image: ${REGISTRY}/notification-service:${IMAGE_TAG}
          ports:
            - containerPort: 8083
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 400m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          env:
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/firebase-adminsdk.json
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MAIL_PASSWORD
          volumeMounts:
            - name: firebase-secret
              mountPath: /app/firebase-adminsdk.json
              subPath: firebase-adminsdk.json
              readOnly: true
      volumes:
        - name: firebase-secret
          secret:
            secretName: firebase-secret
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: kamci
spec:
  selector:
    app: notification-service
  ports:
    - port: 8083
      targetPort: 8083
