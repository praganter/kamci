apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: kamci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      priorityClassName: kamci-high-priority
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: auth-service
          image: ${REGISTRY}/auth-service:${IMAGE_TAG}
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 400m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          env:
            - name: MONGO_DB_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_DB_URI
            - name: SPRING_DATA_MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_DATABASE
            - name: SPRING_DATA_MONGODB_AUTO_INDEX_CREATION
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET_KEY
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_SECRET_KEY
            - name: APP_REDIS_HOST
              value: redis
            - name: APP_REDIS_PORT
              value: "6379"
            - name: APP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/firebase-adminsdk.json
            - name: APPLE_BUNDLE_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APPLE_BUNDLE_ID
                  optional: true
            - name: APPLE_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APPLE_SHARED_SECRET
                  optional: true
            - name: APPLE_ALLOW_SANDBOX
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APPLE_ALLOW_SANDBOX
                  optional: true
            - name: GOOGLE_PLAY_PACKAGE_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_PLAY_PACKAGE_NAME
                  optional: true
            - name: GOOGLE_PUBSUB_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_PUBSUB_AUDIENCE
                  optional: true
            - name: GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL
                  optional: true
            - name: IAP_MONTHLY_PRODUCT_IDS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: IAP_MONTHLY_PRODUCT_IDS
                  optional: true
            - name: IAP_YEARLY_PRODUCT_IDS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: IAP_YEARLY_PRODUCT_IDS
                  optional: true
            # Play Console service account (purchase verification), not the Firebase key above. The file comes from the
            # optional google-play-secret; if it is missing the service starts and Android verification stays off.
            - name: GOOGLE_PLAY_CREDENTIALS
              value: /etc/play-credentials/play-service-account.json
          volumeMounts:
            - name: firebase-secret
              mountPath: /app/firebase-adminsdk.json
              subPath: firebase-adminsdk.json
              readOnly: true
            - name: google-play-secret
              mountPath: /etc/play-credentials
              readOnly: true
      volumes:
        - name: firebase-secret
          secret:
            secretName: firebase-secret
        - name: google-play-secret
          secret:
            secretName: google-play-secret
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: kamci
spec:
  selector:
    app: auth-service
  ports:
    - port: 8082
      targetPort: 8082
