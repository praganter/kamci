apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: kamci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: auth-service
          image: 203.0.113.10:3000/kamci/auth-service:latest
          ports:
            - containerPort: 8082
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          env:
            - name: MONGO_DB_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_DB_URI
            - name: SPRING_DATA_MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_DATABASE
            - name: SPRING_DATA_MONGODB_AUTO_INDEX_CREATION
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET_KEY
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_SECRET_KEY
            - name: APP_REDIS_HOST
              value: redis
            - name: APP_REDIS_PORT
              value: "6379"
            - name: APP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/firebase-adminsdk.json
          volumeMounts:
            - name: firebase-secret
              mountPath: /app/firebase-adminsdk.json
              subPath: firebase-adminsdk.json
              readOnly: true
      volumes:
        - name: firebase-secret
          secret:
            secretName: firebase-secret
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: kamci
spec:
  selector:
    app: auth-service
  ports:
    - port: 8082
      targetPort: 8082
