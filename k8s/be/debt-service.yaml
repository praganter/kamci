apiVersion: apps/v1
kind: Deployment
metadata:
  name: debt-service
  namespace: kamci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debt-service
  template:
    metadata:
      labels:
        app: debt-service
    spec:
      priorityClassName: kamci-high-priority
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: debt-service
          image: ${REGISTRY}/debt-service:${IMAGE_TAG}
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          env:
            - name: MONGO_DB_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_DB_URI
            - name: SPRING_DATA_MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_DATABASE
            - name: SPRING_DATA_MONGODB_AUTO_INDEX_CREATION
              value: "true"
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: debt-service
  namespace: kamci
spec:
  selector:
    app: debt-service
  ports:
    - port: 8081
      targetPort: 8081
