apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-service
  namespace: kamci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-service
  template:
    metadata:
      labels:
        app: cache-service
    spec:
      priorityClassName: kamci-high-priority
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: cache-service
          image: 203.0.113.10:3000/kamci/cache-service:latest
          ports:
            - containerPort: 8084
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 384Mi
          env:
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: APP_REDIS_HOST
              value: redis
            - name: APP_REDIS_PORT
              value: "6379"
            - name: APP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cache-service
  namespace: kamci
spec:
  selector:
    app: cache-service
  ports:
    - port: 8084
      targetPort: 8084
