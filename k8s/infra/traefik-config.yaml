# Customises the Traefik HelmChart bundled with k3s (kube-system).
# - externalTrafficPolicy: Local -> Traefik sees the real client IP (the gateway rate limit keys on X-Forwarded-For)
# - letsencrypt certResolver (HTTP-01, web entrypoint) -> TLS for gateway-ingress
# - persistence -> acme.json survives pod restarts (avoids Let's Encrypt rate limits)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    persistence:
      enabled: true
      path: /data
      size: 128Mi
    certificatesResolvers:
      letsencrypt:
        acme:
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
