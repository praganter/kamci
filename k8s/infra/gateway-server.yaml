apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-server
  namespace: kamci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-server
  template:
    metadata:
      labels:
        app: gateway-server
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: gateway-server
          image: 198.51.100.10:3000/kamci/gateway-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JAVA_OPTS
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET_KEY
            - name: EUREKA_URI
              value: http://eureka-server:8761/eureka
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-server
  namespace: kamci
spec:
  type: NodePort
  selector:
    app: gateway-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
