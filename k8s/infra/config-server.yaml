apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: kamci
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      priorityClassName: kamci-high-priority
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: config-server
          image: 203.0.113.10:3000/kamci/config-server:latest
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 300m
              memory: 448Mi
          env:
            - name: JAVA_OPTS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JAVA_OPTS
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: kamci
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
