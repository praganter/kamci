# HTTPS entry for gateway-server (Traefik IngressRoute + Let's Encrypt, see traefik-config.yaml).
# Hosts come from envsubst (${API_HOST}); see README.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-ingress
  namespace: kamci
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${API_HOST}`)
      kind: Rule
      services:
        - name: gateway-server
          port: 8080
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: kamci
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTP -> HTTPS redirect for this host only; grafana-ingress (HTTP) is not affected.
# Traefik handles the ACME HTTP-01 challenge before this router.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-ingress-http
  namespace: kamci
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${API_HOST}`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: gateway-server
          port: 8080
