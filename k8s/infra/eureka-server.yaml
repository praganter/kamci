apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: kamci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: eureka-server
          image: 203.0.113.10:3000/kamci/eureka-server:latest
          ports:
            - containerPort: 8761
          env:
            - name: JAVA_OPTS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JAVA_OPTS
            - name: EUREKA_INSTANCE_HOSTNAME
              value: eureka-server
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: kamci
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
