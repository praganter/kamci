# Template only - all values are fake. Real values go through kubeseal (see README).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: kamci
type: Opaque
stringData:
  ADMIN_SECRET_KEY: CHANGE_ME
  JWT_SECRET_KEY: CHANGE_ME            # shared by auth-service and gateway-server (and config/)
  JAVA_OPTS: CHANGE_ME                 # e.g. -Xms128m -Xmx384m
  MAIL_USERNAME: CHANGE_ME
  MAIL_PASSWORD: CHANGE_ME
  MONGO_DATABASE: CHANGE_ME
  MONGO_DB_URI: CHANGE_ME              # mongodb://<user>:<pass>@mongodb:27017/<db>?authSource=admin
  MONGO_ROOT_USER: CHANGE_ME
  MONGO_ROOT_PASSWORD: CHANGE_ME
  RABBITMQ_DEFAULT_USER: CHANGE_ME
  RABBITMQ_DEFAULT_PASS: CHANGE_ME
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: CHANGE_ME
  GF_SECURITY_ADMIN_PASSWORD: CHANGE_ME
  # In-app purchase verification (auth-service). All optional: omit a key or leave it empty to keep that part off.
  APPLE_BUNDLE_ID: ""
  APPLE_SHARED_SECRET: ""              # only for the legacy receipt endpoint
  APPLE_ALLOW_SANDBOX: "false"
  GOOGLE_PLAY_PACKAGE_NAME: ""
  GOOGLE_PUBSUB_AUDIENCE: ""
  GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: ""
  IAP_MONTHLY_PRODUCT_IDS: ""          # comma-separated store product ids
  IAP_YEARLY_PRODUCT_IDS: ""
