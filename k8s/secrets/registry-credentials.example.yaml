# Template only. Image-pull secret for the private container registry.
# .dockerconfigjson = {"auths":{"<REGISTRY_HOST>":{"username":"CHANGE_ME","password":"CHANGE_ME","auth":"<base64 user:pass>"}}}
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: kamci
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.example.com":{"username":"CHANGE_ME","password":"CHANGE_ME"}}}'
