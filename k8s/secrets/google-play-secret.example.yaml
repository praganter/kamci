# Template only. Optional: Google Play Developer API service account used by auth-service to verify Android purchases.
# Not the Firebase key (firebase-secret). Without this Secret the pod still starts and Android verification stays off.
apiVersion: v1
kind: Secret
metadata:
  name: google-play-secret
  namespace: kamci
type: Opaque
stringData:
  play-service-account.json: |
    {"type": "service_account", "project_id": "CHANGE_ME", "private_key": "CHANGE_ME"}
