title = "kamci gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders and dev-only defaults"
regexes = [
  '''CHANGE_ME[A-Za-z0-9_]*''',
  '''mongodb://dev:dev@''',
  '''change-me-at-least-32-[A-Za-z0-9-]*''',
  '''TestPass123!''',
  '''192\.0\.2\.10''',
  '''198\.51\.100\.10''',
  '''203\.0\.113\.10''',
]
paths = [
  '''(^|/)[^/]*\.example(\.[a-z]+)?$''',
]
